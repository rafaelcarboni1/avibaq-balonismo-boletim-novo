<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#2563eb" stroke="#1d4ed8" stroke-width="16"/>
  
  <!-- Hot air balloon -->
  <g transform="translate(256, 256)">
    <!-- Balloon envelope -->
    <ellipse cx="0" cy="-80" rx="80" ry="100" fill="#ef4444"/>
    <ellipse cx="0" cy="-80" rx="60" ry="80" fill="#dc2626"/>
    
    <!-- Balloon stripes -->
    <ellipse cx="0" cy="-80" rx="40" ry="60" fill="#b91c1c"/>
    <ellipse cx="0" cy="-80" rx="20" ry="40" fill="#991b1b"/>
    
    <!-- Basket -->
    <rect x="-15" y="40" width="30" height="20" rx="2" fill="#92400e"/>
    <rect x="-12" y="42" width="24" height="16" fill="#b45309"/>
    
    <!-- Ropes -->
    <line x1="-60" y1="10" x2="-12" y2="40" stroke="#374151" stroke-width="2"/>
    <line x1="60" y1="10" x2="12" y2="40" stroke="#374151" stroke-width="2"/>
    <line x1="-30" y1="-5" x2="-8" y2="40" stroke="#374151" stroke-width="2"/>
    <line x1="30" y1="-5" x2="8" y2="40" stroke="#374151" stroke-width="2"/>
    
    <!-- Text AVIBAQ -->
    <text x="0" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">AVIBAQ</text>
  </g>
</svg>